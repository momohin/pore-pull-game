<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f5d9cf" />
<title>角栓ぬき - PORE PULL v3</title>
<style>
:root{
  --ink:#2b211d; --pink:#eb7390; --pink2:#f4a5b8;
  --skin1:#efb9a5; --skin2:#f8cfbd; --skin3:#e8aa96;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:#f3d9cf;overflow:hidden}
button{font:inherit}
.app{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#f7e4dc,#f0d1c6)}
.screen{position:absolute;inset:0;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));display:none}
.screen.active{display:flex}
#home{flex-direction:column;justify-content:space-between}
.toprow,.gamebar{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:46px;height:46px;border:0;border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 8px 24px rgba(72,42,32,.12);font-size:22px}
.hero{text-align:center}
.nose{width:270px;height:218px;margin:auto;border-radius:46% 46% 54% 54%;position:relative;background:
radial-gradient(circle at 22% 25%,#80645a 0 1.7px,transparent 2.2px),
radial-gradient(circle at 38% 44%,#795d53 0 1.5px,transparent 2px),
radial-gradient(circle at 63% 28%,#775c52 0 1.7px,transparent 2.2px),
radial-gradient(circle at 72% 53%,#82675b 0 1.6px,transparent 2.1px),
radial-gradient(circle at 48% 65%,#785b51 0 1.5px,transparent 2px),
linear-gradient(135deg,var(--skin1),var(--skin2) 58%,var(--skin3));box-shadow:inset 0 0 50px rgba(255,255,255,.42),0 18px 40px rgba(90,48,35,.12)}
.nose:before,.nose:after{content:"";position:absolute;bottom:20px;width:48px;height:25px;background:#71493f;border-radius:50%;box-shadow:inset 0 5px 8px rgba(0,0,0,.2)}
.nose:before{left:60px}.nose:after{right:60px}
h1{font-size:43px;margin:10px 0 0;letter-spacing:.08em}
.sub{font-weight:800;letter-spacing:.3em;margin-top:2px}
.tag{margin-top:9px;font-size:16px}
.play{width:100%;border:0;border-radius:28px;padding:18px;background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;font-size:23px;font-weight:900;box-shadow:0 12px 28px rgba(230,100,130,.28)}
.homegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.small{border:0;border-radius:20px;padding:14px 4px;background:rgba(255,255,255,.72);font-weight:800;box-shadow:0 8px 20px rgba(70,40,30,.08)}
#game{flex-direction:column;background:linear-gradient(#efc0ad,#f8d5c8)}
.stage{font-weight:900;font-size:19px}
.pill{background:rgba(88,57,47,.62);color:#fff;padding:9px 13px;border-radius:15px;font-weight:900}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden;margin-top:9px}
.progress>div{height:100%;width:0;background:#fff;border-radius:inherit;transition:.25s}
.skin{position:relative;flex:1;margin:14px 0;border-radius:34px;overflow:hidden;box-shadow:inset 0 0 75px rgba(127,71,53,.12),0 12px 30px rgba(75,44,34,.12);background:
radial-gradient(circle at 10% 18%,rgba(255,255,255,.14),transparent 1.4%),
radial-gradient(circle at 82% 25%,rgba(255,255,255,.15),transparent 1.2%),
radial-gradient(circle at 63% 78%,rgba(255,255,255,.12),transparent 1.2%),
repeating-radial-gradient(circle at 30% 30%,rgba(115,70,55,.05) 0 1px, transparent 1px 9px),
linear-gradient(135deg,var(--skin1),var(--skin2) 57%,var(--skin3));}
.pore{
  --pull:0;
  --lift:0px;
  position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;touch-action:none;display:grid;place-items:center;z-index:3;
}
.tension{
  position:absolute;left:50%;top:50%;width:92px;height:66px;border-radius:50%;
  transform:translate(-50%,-50%) translateY(calc(var(--lift) * .48)) scaleX(calc(1 - var(--pull)*.18)) scaleY(calc(1 + var(--pull)*.55));
  background:radial-gradient(ellipse at 50% 42%,rgba(255,225,214,.36) 0 28%,rgba(205,119,96,.12) 52%,transparent 74%);
  box-shadow:inset 0 -8px 18px rgba(129,67,52,.10),0 -6px 14px rgba(255,237,230,.12);
  opacity:calc(.08 + var(--pull)*.95);
  pointer-events:none;z-index:0;transition:opacity .08s linear;
}
.rim{
  position:absolute;inset:2px;border-radius:50%;
  background:radial-gradient(circle,#654a43 0 24%,#9f7164 34%,rgba(226,158,138,.96) 50%,rgba(239,184,165,.15) 71%,transparent 74%);
  box-shadow:0 1px 2px rgba(95,48,37,.16);
  transform:translateY(var(--lift)) scaleX(calc(1 - var(--pull)*.12)) scaleY(calc(1 + var(--pull)*.25));
  z-index:1;
}
.pore.grabbed .rim{box-shadow:0 -2px 5px rgba(255,235,226,.26),0 4px 8px rgba(110,55,44,.14)}
.pore.ready{animation:pulse 1.35s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}}
.plug{
  position:absolute;left:50%;top:50%;width:16px;height:56px;border-radius:50% 50% 43% 43%;
  transform:translate(-50%,-10px);transform-origin:50% 100%;opacity:0;pointer-events:none;
  background:linear-gradient(#fff7d6 0 15%,#e4c98b 45%,#b58a5e 72%,#76513e 100%);
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.18));z-index:4;
}
.pore.big .plug{width:22px;height:74px}
.pore.long .plug{height:92px}
.pore.black .plug{background:linear-gradient(#3b302d 0 12%,#d9c18c 18%,#b8875b 70%,#704a38)}
.pore.white .plug{background:linear-gradient(#fffdf1,#f1e7c2 60%,#d2b883)}
.pore.grabbed .plug{opacity:1}
.hole{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.15);border-radius:47% 53% 51% 49%;opacity:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at 48% 43%,rgba(20,12,10,.88) 0 15%,rgba(65,38,31,.96) 24%,rgba(111,61,49,.88) 42%,rgba(170,90,73,.42) 60%,rgba(230,150,129,.08) 77%,transparent 80%);
  box-shadow:
    inset 0 4px 7px rgba(0,0,0,.50),
    inset 0 -2px 4px rgba(255,205,188,.12),
    0 0 0 2px rgba(177,84,69,.12);
  filter:blur(.15px);
}
.pore.extracted .rim{opacity:.28;transform:translateY(0) scale(.92)}
.pore.extracted .tension{opacity:.16;transform:translate(-50%,-50%) scale(1)}
.pore.extracted .hole{opacity:1;transform:translate(-50%,-50%) scale(1);transition:.16s cubic-bezier(.2,.9,.25,1.2)}
.pore.smallhole .hole{width:24px;height:20px}
.pore.medhole .hole{width:31px;height:25px}
.pore.bighole .hole{width:41px;height:31px}
.hole.shrink{animation:shrinkHole 6s ease forwards}
@keyframes shrinkHole{
  0%,45%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(.68);opacity:.78;filter:blur(.1px) brightness(1.06)}
}
.hint{text-align:center;background:rgba(103,68,56,.84);color:white;padding:12px 10px;border-radius:19px;font-weight:800}
.burst{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:43px;font-weight:1000;color:white;text-shadow:0 3px 12px rgba(80,40,30,.35);opacity:0;pointer-events:none;z-index:8}
.burst.show{animation:pop .7s ease}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}}
#collection{flex-direction:column;background:#fffaf7;overflow:auto}
.collectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.collectionHead h2{margin:0;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding-bottom:20px}
.card{background:#f2ede8;border-radius:19px;padding:12px 7px;text-align:center;min-height:128px}
.specimen{height:60px;display:grid;place-items:center;font-size:40px}
.locked{filter:grayscale(1);opacity:.28}
.name{font-weight:900;font-size:12px}
.num{font-size:10px;opacity:.55;margin-top:3px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#2f231f;color:white;padding:11px 15px;border-radius:99px;opacity:0;transition:.2s;z-index:20;white-space:nowrap;font-weight:800}
.toast.show{opacity:1}
.badge{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.65);padding:7px 10px;border-radius:99px;font-weight:900;font-size:12px;z-index:7}
.soundnote{font-size:12px;opacity:.72;text-align:center;margin-top:7px}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="toprow">
    <button class="iconbtn" id="soundBtn">🔊</button>
    <div style="font-weight:900">🪙 <span id="coinHome">0</span></div>
  </div>
  <div class="hero">
    <div class="nose"></div>
    <h1>角栓ぬき</h1><div class="sub">PORE PULL</div>
    <div class="tag">にゅる〜、スポッ。毛穴までスッキリ。</div>
  </div>
  <div>
    <button class="play" id="playBtn">プレイする</button>
    <div class="soundnote">※ 最初に画面をタップすると効果音が有効になります</div>
    <div class="homegrid">
      <button class="small" id="bookBtn">📖<br>図鑑</button>
      <button class="small">⭐<br>チャレンジ</button>
      <button class="small">🛒<br>ショップ</button>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <div class="gamebar">
    <button class="iconbtn" id="backBtn">←</button>
    <div class="stage">ステージ1</div>
    <div class="pill">スコア <span id="score">0</span></div>
  </div>
  <div class="progress"><div id="prog"></div></div>
  <div class="skin" id="skin">
    <div class="badge">🪙 <span id="coinGame">0</span></div>
    <div id="pores"></div>
    <div class="burst" id="burst">スポッ！</div>
  </div>
  <div class="hint" id="hint">角栓を押さえて、そのまま上へゆっくり引っぱろう</div>
</section>

<section id="collection" class="screen">
  <div class="collectionHead">
    <button class="iconbtn" id="bookBack">←</button>
    <h2>角栓図鑑</h2>
    <div><b id="colCount">0</b>/9</div>
  </div>
  <div class="grid" id="grid"></div>
</section>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const state={
  coins:+(localStorage.getItem('poreCoinsV3')||0),
  found:JSON.parse(localStorage.getItem('poreFoundV3')||'[]'),
  sound:localStorage.getItem('poreSoundV3')!=='off'
};
const specimens=[
  ['ノーマル角栓','🟡'],['黒ずみ角栓','⚫'],['短い角栓','🟤'],
  ['長い角栓','🌭'],['うねうね角栓','〰️'],['白い角栓','⚪'],
  ['二段角栓','🫘'],['極太角栓','🥜'],['大物角栓','👑']
];
let score=0, removed=0, total=8, active=null, startY=0;
let audioCtx=null;

function ensureAudio(){
  if(!state.sound)return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function noiseBuffer(duration=.08){
  const len=Math.max(1,Math.floor(audioCtx.sampleRate*duration));
  const b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  return b;
}
function playStretch(amount=.5){
  if(!state.sound)return; ensureAudio(); if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  osc.type='sine'; osc.frequency.setValueAtTime(105+amount*35,now);
  osc.frequency.exponentialRampToValueAtTime(72,now+.07);
  f.type='lowpass';f.frequency.value=520;
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.018+amount*.018,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.08);
  osc.connect(f).connect(g).connect(audioCtx.destination);osc.start(now);osc.stop(now+.09);
}
function playPop(big=false){
  if(!state.sound)return; ensureAudio(); if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(big?145:190,now);
  osc.frequency.exponentialRampToValueAtTime(big?58:78,now+.12);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(big?.16:.11,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.16);
  osc.connect(g).connect(audioCtx.destination);osc.start(now);osc.stop(now+.17);

  const src=audioCtx.createBufferSource(),ng=audioCtx.createGain(),bp=audioCtx.createBiquadFilter();
  src.buffer=noiseBuffer(big?.11:.075);bp.type='bandpass';bp.frequency.value=big?700:950;bp.Q.value=.7;
  ng.gain.setValueAtTime(big?.05:.035,now);ng.gain.exponentialRampToValueAtTime(.0001,now+(big?.11:.075));
  src.connect(bp).connect(ng).connect(audioCtx.destination);src.start(now);
}
function playSquish(){
  if(!state.sound)return;ensureAudio();if(!audioCtx)return;
  const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type='triangle';osc.frequency.setValueAtTime(90,now);osc.frequency.exponentialRampToValueAtTime(48,now+.11);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.035,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.13);
  osc.connect(g).connect(audioCtx.destination);osc.start(now);osc.stop(now+.14);
}
document.addEventListener('pointerdown',ensureAudio,{once:true});

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function save(){
  localStorage.setItem('poreCoinsV3',state.coins);
  localStorage.setItem('poreFoundV3',JSON.stringify(state.found));
  localStorage.setItem('poreSoundV3',state.sound?'on':'off');
  $('#coinHome').textContent=state.coins;$('#coinGame').textContent=state.coins;
  $('#soundBtn').textContent=state.sound?'🔊':'🔇';
}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)}
function renderBook(){
  $('#grid').innerHTML='';
  specimens.forEach((s,i)=>{
    let open=state.found.includes(i),d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="specimen ${open?'':'locked'}">${open?s[1]:'❓'}</div><div class="name">${open?s[0]:'？？？'}</div><div class="num">No.${String(i+1).padStart(3,'0')}</div>`;
    $('#grid').appendChild(d)
  }); $('#colCount').textContent=state.found.length
}
function randomType(){
  const r=Math.random();
  if(r<.18)return 1;if(r<.34)return 2;if(r<.49)return 3;if(r<.61)return 4;if(r<.73)return 5;if(r<.84)return 6;if(r<.93)return 7;if(r<.97)return 8;return 0;
}
function newGame(){
  score=0;removed=0;$('#score').textContent=0;$('#prog').style.width='0%';$('#pores').innerHTML='';
  const coords=[[16,20],[42,17],[73,24],[27,43],[61,46],[17,69],[47,72],[76,73]];
  coords.forEach((c,i)=>{
    const type=randomType(),p=document.createElement('div');p.className='pore ready';
    p.style.left=c[0]+'%';p.style.top=c[1]+'%';p.dataset.type=type;p.dataset.double=(type===6?'1':'0');
    if(type===3||type===4)p.classList.add('long');
    if(type===7||type===8)p.classList.add('big');
    if(type===1)p.classList.add('black');
    if(type===5)p.classList.add('white');
    p.classList.add(type>=7?'bighole':type===2?'smallhole':'medhole');
    p.innerHTML='<div class="tension"></div><div class="rim"></div><div class="hole"></div><div class="plug"></div>';
    bindPore(p);$('#pores').appendChild(p)
  });
  $('#hint').textContent='角栓を押さえて、そのまま上へゆっくり引っぱろう'
}
function resetTension(p){
  p.style.setProperty('--pull','0');
  p.style.setProperty('--lift','0px');
}
function completePull(p,type){
  p.dataset.done='1';p.classList.remove('ready');p.classList.add('extracted');
  resetTension(p);
  const plug=p.querySelector('.plug');plug.style.transition='.23s';plug.style.transform='translate(-50%,-145px) scaleY(1.5)';plug.style.opacity='0';
  playPop(type>=7); setTimeout(()=>playSquish(),55);
  setTimeout(()=>p.querySelector('.hole').classList.add('shrink'),800);
  removed++;let gain=(type>=7?250:type===3?180:100);score+=gain;state.coins+=type>=7?12:5;
  if(!state.found.includes(type)){state.found.push(type);toast('✨ 新しい角栓を図鑑に登録！')}else toast(`+${type>=7?12:5} コイン`);
  $('#score').textContent=score;$('#prog').style.width=(removed/total*100)+'%';
  $('#burst').textContent=type>=7?'デカッ！':'スポッ！';$('#burst').classList.remove('show');void $('#burst').offsetWidth;$('#burst').classList.add('show');
  navigator.vibrate?.(type>=7?[35,25,60]:35);save();
  if(p.dataset.double==='1'&&!p.dataset.second){
    p.dataset.second='1';p.dataset.done='';
    setTimeout(()=>{
      plug.style.transition='none';plug.style.opacity='1';plug.style.height='44px';plug.style.width='13px';plug.style.transform='translate(-50%,-8px)';
      p.classList.add('grabbed','ready');p.classList.remove('extracted');p.querySelector('.hole').classList.remove('shrink');
      toast('えっ…まだある！？');$('#hint').textContent='二段目発見！もう一回にゅるっと抜こう'
    },520);
    removed--;$('#prog').style.width=(removed/total*100)+'%';
  }else if(removed===total){
    $('#hint').textContent='✨ 全部スッキリ！ 毛穴もゆっくり戻っていくよ';
    state.coins+=25;save();setTimeout(()=>toast('クリアボーナス +25 🪙'),500)
  }
}
function bindPore(p){
  let lastTick=0;
  p.addEventListener('pointerdown',e=>{
    if(p.dataset.done)return;
    ensureAudio();active=p;startY=e.clientY;p.setPointerCapture(e.pointerId);p.classList.add('grabbed');playSquish()
  });
  p.addEventListener('pointermove',e=>{
    if(active!==p)return;
    const dy=Math.min(0,e.clientY-startY),dist=Math.abs(dy),type=+p.dataset.type;
    const stretch=type===3||type===4?.88:.70;
    const plug=p.querySelector('.plug');
    plug.style.transition='none';
    plug.style.transform=`translate(-50%,${-10+dy*stretch}px) scaleY(${1+Math.min(.95,dist/145)})`;
    const pull=Math.min(1,dist/105), lift=Math.min(16,dist*.14);
    p.style.setProperty('--pull',pull.toFixed(3));
    p.style.setProperty('--lift',(-lift)+'px');
    if(dist-lastTick>22){playStretch(pull);lastTick=dist}
  });
  p.addEventListener('pointerup',e=>{
    if(active!==p)return;
    const dy=e.clientY-startY,type=+p.dataset.type;
    const need=(type===3||type===4)?-90:(type>=7?-80:-62);
    if(dy<need){completePull(p,type)}
    else{
      p.classList.remove('grabbed');resetTension(p);
      const plug=p.querySelector('.plug');plug.style.transition='.18s cubic-bezier(.2,.8,.2,1.2)';plug.style.transform='translate(-50%,-10px)';
      setTimeout(()=>plug.style.transition='none',200);toast('もう少し上まで！')
    }active=null
  });
  p.addEventListener('pointercancel',()=>{if(active===p){p.classList.remove('grabbed');resetTension(p);active=null}})
}
$('#playBtn').onclick=()=>{ensureAudio();newGame();show('#game')};
$('#backBtn').onclick=()=>show('#home');
$('#bookBtn').onclick=()=>{renderBook();show('#collection')};
$('#bookBack').onclick=()=>show('#home');
$('#soundBtn').onclick=()=>{state.sound=!state.sound;ensureAudio();save();toast(state.sound?'効果音 ON 🔊':'効果音 OFF 🔇')};
save();
</script>
</body>
</html>
